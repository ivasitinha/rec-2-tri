<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Octógono Giratório na Gangorra</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
            overflow: hidden;
        }

        .gangorra-container {
            position: relative;
            width: 7cm;
            height: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: balanco 3s ease-in-out infinite;
        }

        .linha {
            width: 100%;
            height: 100%;
            background-color: white;
            position: absolute;
        }

        .octogono {
            width: 20px;
            height: 20px;
            background-color: white;
            position: absolute;
            /* Ajuste para o centro da forma bater com a linha */
            bottom: 2px; 
            
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            
            /* Chamando a animação de deslizar e girar */
            animation: deslizar-e-girar 3s ease-in-out infinite;
        }

        @keyframes balanco {
            0%, 100% { transform: rotate(-20deg); }
            50% { transform: rotate(20deg); }
        }

        /* Inverti os valores de 3.5cm e adicionei a rotação */
        @keyframes deslizar-e-girar {
            0%, 100% { 
                /* Começa na direita e com rotação 360 */
                transform: translateX(3.5cm) rotate(360deg); 
            }
            50% { 
                /* Vai para a esquerda e zera a rotação */
                transform: translateX(-3.5cm) rotate(0deg); 
            }
        }
    </style>
</head>
<body>

    <div class="gangorra-container">
        <div class="linha"></div>
        <div class="octogono"></div>
    </div>

</body>
</html>
