<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gangorra com Física</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: black;
            overflow: hidden;
        }

        .scene {
            position: relative;
            width: 400px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* Base triangular */
        .base {
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 40px solid white;
            z-index: 1;
        }

        /* Prancha da gangorra */
        .plank {
            position: absolute;
            width: 100%;
            height: 10px;
            background-color: white;
            bottom: 40px; /* Altura da base */
            transform-origin: center;
            animation: tilt 3s ease-in-out infinite alternate;
        }

        /* A bola com movimento horizontal e vertical */
        .ball {
            position: absolute;
            width: 25px;
            height: 25px;
            background-color: white;
            border-radius: 50%;
            bottom: 10px; /* Fica sobre a prancha */
            left: 0;
            /* Animação X e Y separadas para simular gravidade/rolagem */
            animation: 
                roll 3s ease-in-out infinite alternate,
                jump-physics 3s ease-in-out infinite alternate;
        }

        /* Inclinação da prancha */
        @keyframes tilt {
            0% { transform: rotate(-15deg); }
            100% { transform: rotate(15deg); }
        }

        /* Movimento da esquerda para a direita */
        @keyframes roll {
            0% { left: 5px; }
            100% { left: calc(100% - 30px); }
        }

        /* Ajuste de altura para a bola não "entrar" na prancha enquanto ela inclina */
        @keyframes jump-physics {
            0% { transform: translateY(45px); }    /* Lado esquerdo baixo */
            50% { transform: translateY(0px); }     /* Centro (ponto mais alto) */
            100% { transform: translateY(45px); }  /* Lado direito baixo */
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="plank">
            <div class="ball"></div>
        </div>
        <div class="base"></div>
    </div>

</body>
</html>
